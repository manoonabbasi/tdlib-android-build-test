name: Build Latest TDLib for Android

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build TDLib arm64-v8a
        run: |
          echo "Current directory: $(pwd)"
          ls -la

          mkdir -p build-arm64 && cd build-arm64

          echo "=== CMake configure ==="
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_shared \
                -DCMAKE_BUILD_TYPE=Release \
                -DTD_ENABLE_JNI=ON \
                -G "Unix Makefiles" \
                ..

          echo "=== Build tdjson_shared target ==="
          cmake --build . --target tdjson_shared -j2 || cmake --build . --target tdjson -j2

          echo "=== List all .so files produced ==="
          find . -name "*.so" -type f

          echo "=== Copy libtdjson.so if found ==="
          mkdir -p ../output/arm64-v8a
          cp libtdjson.so ../output/arm64-v8a/ 2>/dev/null || cp libtdjson_shared.so ../output/arm64-v8a/libtdjson.so 2>/dev/null || echo "No .so found - see find output above"

          ls -la ../output/arm64-v8a/

      - name: Upload TDLib binary (if any)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdlib-android-arm64
          path: output/
          retention-days: 30
