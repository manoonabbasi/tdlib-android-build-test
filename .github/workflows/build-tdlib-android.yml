name: Build TDLib for Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Install Native Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli zlib1g-dev libssl-dev

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # This is the "Magic" step: We use a script to build OpenSSL for Android architecture
      - name: Build OpenSSL for Android
        run: |
          git clone https://github.com/KDAB/android_openssl.git
          # This provides a helper but we need the actual compiled libs.
          # For GitHub Actions, it's often easier to use a prebuilt or a specific cross-compile script.
          # Alternatively, we can let TDLib find the NDK-provided ones or a unified builder.
          
      - name: Build TDLib (arm64-v8a)
        run: |
          php SplitSource.php
          mkdir build-arm64
          cd build-arm64
          
          # We point to the NDK and turn OFF JNI for Flutter FFI compatibility
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=OFF \
            -G "Unix Makefiles"

          # Only build the json interface to save time/memory
          cmake --build . --target tdjson -j$(nproc)
          
          mkdir -p ../output/arm64-v8a
          cp libtdjson.so ../output/arm64-v8a/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-so
          path: output/
