name: Build TDLib for Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master
          fetch-depth: 1

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli zlib1g-dev libssl-dev build-essential

      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build TDLib (arm64-v8a)
        run: |
          # 1. Prepare source files to prevent Out-of-Memory crashes
          php SplitSource.php
          
          # 2. Create and enter build directory
          mkdir build-android
          cd build-android
          
          # 3. Direct CMake call
          # This explicitly sets the STL to avoid the error you saw earlier
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=OFF \
            -G "Unix Makefiles"

          # 4. Compile the library
          # We use -j2 because free GitHub runners only have 7GB of RAM
          cmake --build . --target tdjson -j2

      - name: Prepare and Upload Artifact
        run: |
          mkdir -p output/arm64-v8a
          # Copy the compiled library to our output folder
          cp build-android/libtdjson.so output/arm64-v8a/
          
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: output/
          retention-days: 5
