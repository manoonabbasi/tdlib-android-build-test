name: Build TDLib for Android (Verified 2026)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli zlib1g-dev libssl-dev build-essential

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      # PASS 1: Generate source files using the native Linux compiler
      - name: Generate Source Files
        run: |
          php SplitSource.php
          mkdir build-native
          cd build-native
          cmake ..
          cmake --build . --target prepare_cross_compiling -j2

      # PASS 2: Cross-compile the actual Android .so file
      - name: Build Android Library
        run: |
          mkdir build-android
          cd build-android
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=OFF \
            -G "Unix Makefiles"
          
          # Now that 'prepare_cross_compiling' ran in Pass 1, this target WILL exist
          cmake --build . --target tdjson -j2

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: build-android/libtdjson.so
