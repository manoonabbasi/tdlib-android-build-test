name: Build Latest TDLib for Android final

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Install OpenSSL (required by TDLib)
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build TDLib arm64-v8a (with OpenSSL + correct target)
        run: |
          mkdir -p build-arm64 && cd build-arm64

          echo "=== Step 1: Configuring CMake with OpenSSL ==="
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_shared \
                -DCMAKE_BUILD_TYPE=Release \
                -DTD_ENABLE_JNI=ON \
                -DCMAKE_FIND_ROOT_PATH=/usr/lib/aarch64-linux-gnu \
                -DOPENSSL_ROOT_DIR=/usr \
                -G "Unix Makefiles" \
                ..

          echo "=== Step 2: Building the real tdjson library ==="
          cmake --build . --target tdjson_shared -j2

          echo "=== Step 3: Copying libtdjson.so ==="
          mkdir -p ../output/arm64-v8a
          cp libtdjson.so ../output/arm64-v8a/ || cp libtdjson_shared.so ../output/arm64-v8a/libtdjson.so

          ls -la ../output/arm64-v8a/

      - name: Upload TDLib binary
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: output/
          retention-days: 30
