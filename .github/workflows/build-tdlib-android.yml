name: Build TDLib for Android (Final)

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master
          fetch-depth: 1

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli zlib1g-dev libssl-dev build-essential

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build TDLib arm64-v8a
        run: |
          cd example/android
          
          # The script expects: ./build-tdlib.sh <NDK_PATH> <SDK_PATH> <ARCH> <API_LEVEL>
          # We use ANDROID_HOME which is pre-set on GitHub runners for the SDK path
          chmod +x build-tdlib.sh
          
          # We force the script to use our NDK and target arm64
          # Note: We use -j2 to prevent the GitHub runner from running out of RAM
          ./build-tdlib.sh ${{ steps.setup-ndk.outputs.ndk-path }} $ANDROID_HOME arm64-v8a 24
          
      - name: Prepare Artifacts
        run: |
          mkdir -p output/arm64-v8a
          # The script places built files in example/android/dist/lib/arm64-v8a
          # We find the .so and copy it
          find example/android -name "libtdjson.so" -exec cp {} output/arm64-v8a/ \;

      - name: Upload TDLib
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: output/
