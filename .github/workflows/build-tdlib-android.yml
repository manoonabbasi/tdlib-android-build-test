name: Build Latest TDLib for Android

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build TDLib arm64-v8a (no OpenSSL, JSON only)
        run: |
          mkdir -p build-arm64 && cd build-arm64

          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_shared \
                -DCMAKE_BUILD_TYPE=Release \
                -DTD_ENABLE_JNI=ON \
                -DTD_ENABLE_OPENSSL=OFF \   # ← Disable OpenSSL requirement
                -DTD_ENABLE_DOTNET=OFF \
                -DTD_ENABLE_PYTHON=OFF \
                -G "Unix Makefiles" \
                ..

          cmake --build . --target tdjson_shared -j2 || cmake --build . --target tdjson -j2

          mkdir -p ../output/arm64-v8a
          cp libtdjson.so ../output/arm64-v8a/ 2>/dev/null || cp libtdjson_shared.so ../output/arm64-v8a/libtdjson.so 2>/dev/null || echo "No libtdjson.so found - check build logs"

          ls -la ../output/arm64-v8a/

      - name: Upload TDLib
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: output/
          retention-days: 30
