name: Build TDLib for Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli zlib1g-dev libssl-dev build-essential

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Run Official Android Build Script
        run: |
          # The official script is in example/android/build.sh
          # It handles OpenSSL cross-compilation automatically.
          cd example/android
          
          # We must provide the NDK path to the script
          export ANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          
          # Make script executable and run it
          chmod +x build.sh
          ./build.sh --env arm64-v8a
          
      - name: Prepare Artifacts
        run: |
          # The script puts the results in example/android/dist
          mkdir -p output/arm64-v8a
          cp example/android/dist/arm64-v8a/libtdjson.so output/arm64-v8a/

      - name: Upload TDLib
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: output/
