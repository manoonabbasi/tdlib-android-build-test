name: Build Latest TDLib for Android

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli zlib1g-dev libssl-dev

      - name: Setup Android NDK r27c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build TDLib arm64-v8a
        run: |
          # 1. Prepare output directory
          mkdir -p output/arm64-v8a
          
          # 2. Run SplitSource to save memory (prevents OOM on GitHub runners)
          php SplitSource.php
          
          # 3. Configure CMake
          mkdir build-arm64
          cd build-arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=OFF \
            -G "Unix Makefiles"

          # 4. Build only the JSON interface (faster and what you need for Flutter)
          cmake --build . --target tdjson -j$(nproc)

          # 5. Move binary to output
          cp libtdjson.so ../output/arm64-v8a/
          
      - name: Upload TDLib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-release
          path: output/
          retention-days: 7
