name: Build TDLib for Android (Final 2026)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gperf php-cli zlib1g-dev libssl-dev build-essential

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: 🛠️ PASS 1: Build Native Tools
        run: |
          # We need to generate the C++ source files using Linux tools first
          php SplitSource.php
          mkdir build-native
          cd build-native
          cmake .. -DCMAKE_BUILD_TYPE=Release
          # This creates the 'tl_generate_common' and other generator tools
          cmake --build . --target prepare_cross_compiling -j$(nproc)

      - name: PASS 2: Build Android Library
        run: |
          mkdir build-android
          cd build-android
          # We point to the NDK and tell CMake where the NATIVE tools from Pass 1 are
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DTD_ENABLE_JNI=OFF \
            -G "Unix Makefiles"
          
          # This command will now find the 'tdjson' target because Pass 1 prepared the files
          cmake --build . --target tdjson -j2

      - name: 📦 Prepare Artifact
        run: |
          mkdir -p output/arm64-v8a
          cp build-android/libtdjson.so output/arm64-v8a/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: output/
