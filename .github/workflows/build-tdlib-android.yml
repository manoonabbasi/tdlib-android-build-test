name: Build Latest TDLib for Android

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build TDLib arm64-v8a (with code generation)
        run: |
          mkdir -p build-arm64 && cd build-arm64

          echo "=== Configuring CMake ==="
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_shared \
                -DCMAKE_BUILD_TYPE=Release \
                -DTD_ENABLE_JNI=ON \
                -DTD_JSON=ON \
                -G "Unix Makefiles" \
                ..

          echo "=== Running Code Generation (this fixes the mime_type error) ==="
          make td_generate -j2

          echo "=== Building TDLib ==="
          make -j2   # -j2 is safe on GitHub free runners

          echo "=== Copying output ==="
          mkdir -p ../output/arm64-v8a
          cp libtdjson.so ../output/arm64-v8a/

      - name: Upload TDLib binary
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: output/
          retention-days: 30
