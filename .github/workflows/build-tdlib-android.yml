name: Build Latest TDLib for Android

on:
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest TDLib
        uses: actions/checkout@v4
        with:
          repository: tdlib/td
          ref: master

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: Build TDLib arm64-v8a (Final safe version)
        run: |
          mkdir -p build-arm64 && cd build-arm64

          echo "=== Step 1: Configuring CMake ==="
          cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a \
                -DANDROID_PLATFORM=android-24 \
                -DANDROID_STL=c++_shared \
                -DCMAKE_BUILD_TYPE=Release \
                -DTD_ENABLE_JNI=ON \
                -G "Unix Makefiles" \
                ..

          echo "=== Step 2: Building tdjson (this includes all code generation) ==="
          cmake --build . --target tdjson -j2

          echo "=== Step 3: Copying libtdjson.so ==="
          mkdir -p ../output/arm64-v8a
          cp libtdjson.so ../output/arm64-v8a/

          echo "=== Build completed successfully ==="

      - name: Upload TDLib binary
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-android-arm64
          path: output/
          retention-days: 30
